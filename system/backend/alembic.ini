# Alembic — ЗӨВХӨН Postgres-ийн схем. SQLite нь `app/schema.py`-ийн
# ALTER-ын автомат нөхөлтөөр явна (`python -m app.migrate --create`).
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url нь env.py дотор DATABASE_URL-ээс уншигдана — энд БИЧИХГҮЙ
# (нууц үгтэй холболтын мөр репод орох ёсгүй).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
