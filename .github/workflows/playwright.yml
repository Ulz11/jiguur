name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

    # Backend нь суулгасан frontend/dist-ийг өөрөө үйлчилдэг тул нэг л сервер
    # хэрэгтэй. playwright.config.ts-ийн `webServer` үүнийг өөрөө асаана —
    # энд зөвхөн venv-ийг нь бэлдэнэ. Хоосон DB дээр `seed()` өөрөө ажиллана.
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Prepare backend venv
      run: |
        python -m venv system/backend/.venv
        system/backend/.venv/bin/pip install --upgrade pip
        system/backend/.venv/bin/pip install -r system/backend/requirements.txt

    - name: Backend unit tests
      run: system/backend/.venv/bin/python -m pytest tests/ -q
      working-directory: system/backend
      env:
        JIGUUR_NO_CRON: '1'

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
